name: CI

# Disabled for now: no automatic triggers, manual-only via Actions tab /
# `gh workflow run`. Restore the push/pull_request triggers below to
# re-enable.
on:
  workflow_dispatch:

jobs:
  test:
    # Windows-only for now (this is the only platform the hardware protocol
    # has been verified on). Add ubuntu-latest to this matrix once Linux
    # support lands.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv build
